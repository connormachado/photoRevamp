[pytest]
testpaths = tests

# backend/ has no __init__.py and its modules import each other as flat siblings
# (`import stats`, `from utils import ...`), so the directory itself must be on
# sys.path — the same way server.py sees them when run directly.
pythonpath = backend

addopts = -q --strict-markers

markers =
    slow: imports torch transitively (~2s); still pure-logic, just not instant.
